<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#635bff">
<meta name="description" content="SkillXChange - Learn, share and grow through skill exchange.">
<title>SkillXChange | Learn. Share. Grow.</title>

<style>
/* =========================================================
   SKILLXCHANGE
   PREMIUM SINGLE-FILE FRONTEND
   ========================================================= */

@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap');

:root {
    --bg: #f7f8fc;
    --surface: #ffffff;
    --surface-2: #f1f3f9;
    --surface-3: #eef0f7;
    --text: #11131a;
    --muted: #727887;
    --border: #e7e9f0;
    --primary: #635bff;
    --primary-dark: #5148ef;
    --primary-soft: #eeecff;
    --success: #18a86b;
    --success-soft: #e6f8f0;
    --warning: #d99018;
    --warning-soft: #fff5dc;
    --danger: #e04f5f;
    --shadow: 0 18px 50px rgba(21, 27, 46, 0.07);
    --shadow-small: 0 8px 25px rgba(21, 27, 46, 0.06);
    --radius: 18px;
}

body.dark {
    --bg: #090b10;
    --surface: #11141b;
    --surface-2: #171a22;
    --surface-3: #1b1f28;
    --text: #f5f6fa;
    --muted: #9298a7;
    --border: #272c37;
    --primary-soft: #211f4d;
    --success-soft: #102e22;
    --warning-soft: #302713;
    --shadow: 0 18px 50px rgba(0,0,0,.25);
    --shadow-small: 0 8px 25px rgba(0,0,0,.22);
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "DM Sans", Arial, sans-serif;
    transition: background .25s, color .25s;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    border: 0;
    cursor: pointer;
}

a {
    color: inherit;
    text-decoration: none;
}

::selection {
    background: var(--primary);
    color: white;
}

/* =========================================================
   HEADER
   ========================================================= */

.topbar {
    height: 76px;
    position: fixed;
    left: 0;
    right: 0;
    top: 0;
    z-index: 100;

    display: flex;
    align-items: center;
    gap: 24px;

    padding: 0 28px;

    background: color-mix(
        in srgb,
        var(--surface) 88%,
        transparent
    );

    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
    min-width: 225px;
}

.logo {
    width: 40px;
    height: 40px;
    border-radius: 13px;

    display: grid;
    place-items: center;

    color: white;
    font-size: 12px;
    font-weight: 800;

    background:
        linear-gradient(
            135deg,
            #635bff,
            #8d68ff
        );

    box-shadow:
        0 8px 20px rgba(99,91,255,.25);
}

.brand-name {
    font-family: Manrope, sans-serif;
    font-weight: 800;
    font-size: 16px;
}

.brand-tagline {
    display: block;
    margin-top: 2px;
    font-size: 10px;
    color: var(--muted);
}

/* SEARCH */

.search {
    flex: 1;
    max-width: 650px;
    position: relative;
    margin: auto;
}

.search-icon {
    position: absolute;
    left: 15px;
    top: 10px;
    color: var(--muted);
    font-size: 19px;
}

.search input {
    width: 100%;
    height: 43px;

    border: 1px solid var(--border);
    border-radius: 13px;

    padding: 0 16px 0 43px;

    background: var(--surface-2);
    color: var(--text);

    outline: none;

    transition: .2s;
}

.search input:focus {
    background: var(--surface);
    border-color: var(--primary);
    box-shadow: 0 0 0 4px var(--primary-soft);
}

.search-results {
    position: absolute;
    left: 0;
    right: 0;
    top: 50px;

    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;

    box-shadow: var(--shadow);

    overflow: hidden;
    display: none;
}

.search-results.show {
    display: block;
}

.search-results button {
    width: 100%;
    text-align: left;
    padding: 13px 15px;
    background: transparent;
    color: var(--text);
}

.search-results button:hover {
    background: var(--surface-2);
}

/* HEADER ACTIONS */

.header-actions {
    display: flex;
    align-items: center;
    gap: 7px;
    position: relative;
}

.icon-btn {
    width: 40px;
    height: 40px;

    display: grid;
    place-items: center;

    border: 1px solid var(--border);
    border-radius: 12px;

    background: var(--surface);
    color: var(--text);

    transition: .2s;
}

.icon-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
    transform: translateY(-1px);
}

.notification {
    position: relative;
}

.notification-count {
    position: absolute;
    top: -5px;
    right: -4px;

    min-width: 16px;
    height: 16px;

    padding: 0 4px;

    border-radius: 20px;

    display: grid;
    place-items: center;

    background: var(--danger);
    color: white;

    font-size: 8px;
    font-weight: 800;
}

.user-button {
    display: flex;
    align-items: center;
    gap: 9px;

    padding: 5px 8px;

    border-radius: 13px;
    background: transparent;
    color: var(--text);
}

.user-button:hover {
    background: var(--surface-2);
}

.user-avatar {
    width: 37px;
    height: 37px;

    border-radius: 50%;

    display: grid;
    place-items: center;

    background:
        linear-gradient(
            135deg,
            #635bff,
            #9c6cff
        );

    color: white;

    font-size: 11px;
    font-weight: 800;
}

.user-info {
    text-align: left;
}

.user-info small {
    display: block;
    font-size: 9px;
    color: var(--muted);
}

.user-info strong {
    display: block;
    max-width: 120px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    font-size: 12px;
}

.profile-dropdown {
    position: absolute;
    right: 0;
    top: 52px;

    width: 210px;

    padding: 7px;

    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 15px;

    box-shadow: var(--shadow);

    display: none;
}

.profile-dropdown.show {
    display: block;
}

.profile-dropdown button {
    width: 100%;
    padding: 11px 12px;

    border-radius: 9px;

    text-align: left;

    background: transparent;
    color: var(--text);
}

.profile-dropdown button:hover {
    background: var(--surface-2);
}

/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar {
    position: fixed;

    top: 76px;
    bottom: 0;
    left: 0;

    width: 248px;

    padding: 23px 14px;

    background: var(--surface);
    border-right: 1px solid var(--border);

    z-index: 90;

    display: flex;
    flex-direction: column;
}

.nav-title {
    padding: 0 12px;
    margin: 0 0 9px;

    color: var(--muted);
    font-size: 9px;
    font-weight: 800;

    text-transform: uppercase;
    letter-spacing: .12em;
}

.nav-item {
    width: 100%;

    display: flex;
    align-items: center;
    gap: 13px;

    padding: 12px 14px;
    margin-bottom: 3px;

    border-radius: 11px;

    background: transparent;
    color: var(--muted);

    text-align: left;

    transition: .18s;
}

.nav-item:hover {
    color: var(--text);
    background: var(--surface-2);
}

.nav-item.active {
    color: var(--primary);
    background: var(--primary-soft);
    font-weight: 700;
}

.nav-icon {
    width: 20px;
    text-align: center;
}

.side-profile {
    margin-top: auto;

    padding: 14px 9px;

    border-top: 1px solid var(--border);

    display: flex;
    align-items: center;
    gap: 10px;

    background: transparent;
    color: var(--text);

    text-align: left;
}

.side-profile-name {
    font-weight: 700;
    font-size: 12px;
}

.side-profile-status {
    display: block;
    margin-top: 3px;

    color: var(--muted);
    font-size: 9px;
}

.online-dot {
    display: inline-block;

    width: 7px;
    height: 7px;

    border-radius: 50%;
    background: var(--success);

    margin-right: 4px;
}

/* =========================================================
   MAIN
   ========================================================= */

.main {
    margin-left: 248px;

    padding:
        112px
        34px
        55px;

    max-width: 1580px;
    min-height: 100vh;
}

/* =========================================================
   HERO
   ========================================================= */

.hero {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 30px;

    margin-bottom: 28px;
}

.hero-copy {
    max-width: 720px;
}

.eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 7px;

    color: var(--primary);

    font-size: 10px;
    font-weight: 800;

    letter-spacing: .12em;
    text-transform: uppercase;
}

.eyebrow::before {
    content: "";
    width: 22px;
    height: 2px;
    border-radius: 5px;
    background: var(--primary);
}

.hero h1 {
    margin: 8px 0 10px;

    font-family: Manrope, sans-serif;

    font-size: clamp(29px, 4vw, 43px);
    line-height: 1.1;

    letter-spacing: -.035em;
}

.hero h1 span {
    color: var(--primary);
}

.hero p {
    margin: 0;

    color: var(--muted);

    font-size: 14px;
    line-height: 1.7;
}

.hero-actions {
    display: flex;
    gap: 9px;
}

/* =========================================================
   BUTTONS
   ========================================================= */

.btn {
    min-height: 42px;

    padding: 0 17px;

    border-radius: 11px;

    background: var(--primary);
    color: white;

    font-weight: 700;
    font-size: 12px;

    transition: .18s;

    box-shadow:
        0 7px 18px rgba(99,91,255,.16);
}

.btn:hover {
    background: var(--primary-dark);
    transform: translateY(-2px);
}

.btn.secondary {
    background: var(--primary-soft);
    color: var(--primary);
    box-shadow: none;
}

.btn.secondary:hover {
    background: var(--surface-3);
}

.btn.ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    box-shadow: none;
}

.btn.small {
    min-height: 34px;
    padding: 0 12px;
    font-size: 10px;
}

/* =========================================================
   CARDS
   ========================================================= */

.card {
    background: var(--surface);

    border: 1px solid var(--border);

    border-radius: var(--radius);

    box-shadow: var(--shadow-small);

    padding: 20px;
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 15px;

    margin-bottom: 16px;
}

.card-title {
    margin: 0;

    font-family: Manrope, sans-serif;

    font-size: 16px;
    letter-spacing: -.02em;
}

.card-subtitle {
    margin: 4px 0 0;

    color: var(--muted);

    font-size: 11px;
}

/* =========================================================
   PROFILE SUMMARY
   ========================================================= */

.profile-summary {
    display: flex;
    align-items: center;
    gap: 16px;

    margin-bottom: 26px;

    padding: 19px 21px;
}

.large-avatar {
    width: 58px;
    height: 58px;

    border-radius: 17px;

    display: grid;
    place-items: center;

    flex: 0 0 auto;

    background:
        linear-gradient(
            135deg,
            #635bff,
            #9c6cff
        );

    color: white;

    font-weight: 800;
    font-size: 15px;
}

.profile-summary-main {
    flex: 1;
    min-width: 0;
}

.profile-summary-main h3 {
    margin: 0 0 3px;

    font-size: 15px;
}

.profile-summary-main p {
    margin: 0;

    color: var(--muted);

    font-size: 11px;
}

.profile-stats {
    display: flex;
    gap: 25px;

    margin-top: 13px;
}

.profile-stat strong {
    display: block;
    font-size: 15px;
}

.profile-stat span {
    color: var(--muted);
    font-size: 9px;
}

/* =========================================================
   GRID
   ========================================================= */

.section {
    margin-top: 29px;
}

.section-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 15px;

    margin-bottom: 13px;
}

.section-heading h2 {
    margin: 0;

    font-family: Manrope, sans-serif;

    font-size: 17px;
    letter-spacing: -.02em;
}

.section-heading p {
    margin: 3px 0 0;

    color: var(--muted);
    font-size: 10px;
}

.section-heading button {
    background: transparent;
    color: var(--primary);
    font-size: 10px;
    font-weight: 700;
}

.grid-3 {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
}

.grid-2 {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
}

/* =========================================================
   EMPTY STATES
   ========================================================= */

.empty-state {
    padding: 35px 25px;

    text-align: center;

    border: 1px dashed var(--border);

    border-radius: 16px;

    background:
        linear-gradient(
            180deg,
            var(--surface),
            var(--surface-2)
        );
}

.empty-icon {
    width: 48px;
    height: 48px;

    margin: 0 auto 12px;

    display: grid;
    place-items: center;

    border-radius: 14px;

    background: var(--primary-soft);

    color: var(--primary);

    font-size: 20px;
}

.empty-state h3 {
    margin: 0 0 6px;

    font-size: 14px;
}

.empty-state p {
    max-width: 420px;

    margin: 0 auto 16px;

    color: var(--muted);

    font-size: 11px;
    line-height: 1.6;
}

/* =========================================================
   SKILLS
   ========================================================= */

.skill-card {
    position: relative;
}

.skill-card-top {
    display: flex;
    align-items: flex-start;
    gap: 11px;
}

.skill-icon {
    width: 38px;
    height: 38px;

    display: grid;
    place-items: center;

    flex: 0 0 auto;

    border-radius: 11px;

    background: var(--primary-soft);
    color: var(--primary);

    font-size: 14px;
    font-weight: 800;
}

.skill-info {
    flex: 1;
    min-width: 0;
}

.skill-name {
    display: block;

    font-size: 13px;
    font-weight: 700;
}

.skill-level {
    display: block;

    margin-top: 3px;

    color: var(--muted);

    font-size: 9px;
}

.skill-delete {
    width: 27px;
    height: 27px;

    border-radius: 8px;

    background: transparent;
    color: var(--muted);
}

.skill-delete:hover {
    background: #fff0f1;
    color: var(--danger);
}

.progress {
    height: 6px;

    margin-top: 15px;

    background: var(--surface-3);

    border-radius: 10px;

    overflow: hidden;
}

.progress-bar {
    height: 100%;

    border-radius: 10px;

    background:
        linear-gradient(
            90deg,
            var(--primary),
            #9a71ff
        );
}

.level-control {
    margin-top: 11px;
}

.level-control input {
    width: 100%;
    accent-color: var(--primary);
}

.skill-level-row {
    display: flex;
    justify-content: space-between;

    color: var(--muted);

    font-size: 9px;
}

/* =========================================================
   ADD SKILL
   ========================================================= */

.add-box {
    display: flex;
    gap: 8px;

    margin-bottom: 13px;
}

.input {
    width: 100%;

    height: 42px;

    border: 1px solid var(--border);
    border-radius: 11px;

    padding: 0 13px;

    background: var(--surface-2);
    color: var(--text);

    outline: none;
}

.input:focus,
textarea:focus,
select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px var(--primary-soft);
}

/* =========================================================
   LEARNING TAGS
   ========================================================= */

.learning-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.learning-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    padding: 8px 10px;

    border-radius: 9px;

    background: var(--primary-soft);
    color: var(--primary);

    font-size: 10px;
    font-weight: 700;
}

.learning-tag button {
    width: 17px;
    height: 17px;

    border-radius: 50%;

    background: rgba(99,91,255,.12);

    color: var(--primary);

    display: grid;
    place-items: center;

    font-size: 11px;
}

/* =========================================================
   PEOPLE
   ========================================================= */

.person-card {
    padding: 18px;
}

.person-top {
    display: flex;
    align-items: flex-start;
    gap: 11px;
}

.person-avatar {
    width: 43px;
    height: 43px;

    flex: 0 0 auto;

    border-radius: 13px;

    display: grid;
    place-items: center;

    background:
        linear-gradient(
            135deg,
            #635bff,
            #9c6cff
        );

    color: white;

    font-size: 11px;
    font-weight: 800;
}

.person-main {
    flex: 1;
    min-width: 0;
}

.person-name {
    font-size: 13px;
    font-weight: 800;
}

.person-location {
    display: block;
    margin-top: 3px;

    color: var(--muted);

    font-size: 9px;
}

.match-badge {
    padding: 5px 8px;

    border-radius: 20px;

    background: var(--success-soft);
    color: var(--success);

    font-size: 9px;
    font-weight: 800;
}

.person-bio {
    margin: 12px 0;

    color: var(--muted);

    font-size: 10px;
    line-height: 1.6;
}

.tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.tag {
    padding: 6px 8px;

    border-radius: 8px;

    background: var(--surface-2);

    color: var(--text);

    font-size: 9px;
}

.person-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-top: 15px;
    padding-top: 12px;

    border-top: 1px solid var(--border);
}

.rating {
    color: var(--warning);
    font-size: 10px;
    font-weight: 700;
}

.available {
    color: var(--success);
    font-size: 9px;
}

/* =========================================================
   QUICK ACTIONS
   ========================================================= */

.quick-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
}

.quick-action {
    padding: 17px 10px;

    border: 1px solid var(--border);
    border-radius: 14px;

    background: var(--surface);

    text-align: center;

    transition: .2s;
}

.quick-action:hover {
    transform: translateY(-3px);
    border-color: var(--primary);
    box-shadow: var(--shadow-small);
}

.quick-action-icon {
    width: 38px;
    height: 38px;

    margin: auto;

    display: grid;
    place-items: center;

    border-radius: 11px;

    background: var(--primary-soft);
    color: var(--primary);
}

.quick-action strong {
    display: block;
    margin-top: 8px;

    font-size: 10px;
}

/* =========================================================
   ACTIVITY
   ========================================================= */

.activity-list {
    display: grid;
}

.activity {
    display: flex;
    align-items: center;
    gap: 11px;

    padding: 13px 0;

    border-bottom: 1px solid var(--border);
}

.activity:last-child {
    border-bottom: 0;
}

.activity-icon {
    width: 34px;
    height: 34px;

    display: grid;
    place-items: center;

    border-radius: 10px;

    background: var(--primary-soft);
    color: var(--primary);

    flex: 0 0 auto;
}

.activity-text {
    flex: 1;
}

.activity-text strong {
    display: block;

    font-size: 11px;
}

.activity-text small {
    display: block;

    margin-top: 3px;

    color: var(--muted);

    font-size: 9px;
}

/* =========================================================
   FOOTER
   ========================================================= */

.footer {
    margin-left: 248px;

    padding: 26px 34px;

    border-top: 1px solid var(--border);

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 20px;

    color: var(--muted);

    font-size: 10px;
}

.footer-brand strong {
    display: block;
    color: var(--text);
}

.footer-brand span {
    display: block;
    margin-top: 3px;
}

.footer-links {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
}

.footer-links button {
    color: var(--muted);
    background: transparent;
    font-size: 10px;
}

.footer-links button:hover {
    color: var(--primary);
}

/* =========================================================
   AI
   ========================================================= */

.ai-fab {
    position: fixed;

    right: 26px;
    bottom: 26px;

    width: 58px;
    height: 58px;

    border-radius: 19px;

    display: grid;
    place-items: center;

    background:
        linear-gradient(
            135deg,
            #635bff,
            #986bff
        );

    color: white;

    font-size: 22px;

    box-shadow:
        0 18px 40px rgba(99,91,255,.32);

    z-index: 150;

    transition: .2s;
}

.ai-fab:hover {
    transform: translateY(-4px) rotate(2deg);
}

.ai-panel {
    position: fixed;

    right: 26px;
    bottom: 96px;

    width: 390px;
    height: 570px;

    display: none;
    flex-direction: column;

    overflow: hidden;

    background: var(--surface);

    border: 1px solid var(--border);

    border-radius: 21px;

    box-shadow:

<script>


function getLoggedInUser() {

    let stored = null;

    try {
        stored =
            JSON.parse(
                localStorage.getItem("sx_user")
            );
    } catch(error) {
        stored = null;
    }

    /*
       We intentionally DO NOT use "Guest User".

       If login data is missing, the page will show
       "Welcome" rather than inventing a user name.
    */

    return {
        name:
            stored &&
            typeof stored.name === "string"
            ? stored.name.trim()
            : "",

        location:
            stored &&
            stored.location
            ? stored.location
            : "",

        bio:
            stored &&
            stored.bio
            ? stored.bio
            : "",

        availability:
            stored &&
            stored.availability
            ? stored.availability
            : "Available",

        preferences:
            stored &&
            stored.preferences
            ? stored.preferences
            : "Online exchanges"
    };
}


/* =========================================================
   STATE
========================================================= */

const loggedInUser = getLoggedInUser();

/*
   Each logged-in user gets their own skill storage.
   This prevents old/demo skills from appearing for a new user.
   A new user therefore starts with completely empty skills
   and learning goals.
*/
const userStorageKey = (type) => {
    const identity = (loggedInUser.name || "new-user")
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "") || "new-user";

    return `sx_${type}_${identity}`;
};

const readUserArray = (type) => {
    try {
        const value = localStorage.getItem(userStorageKey(type));
        return value ? JSON.parse(value) : [];
    } catch (error) {
        return [];
    }
};

const state = {

    user: loggedInUser,

    // IMPORTANT: both start EMPTY for every new logged-in user.
    skills: readUserArray("skills"),

    learning: readUserArray("learning"),

    exchanges: readUserArray("exchanges"),

    theme:
        localStorage.getItem("sx_theme") || "light",

    notifications:
        JSON.parse(
            localStorage.getItem("sx_notifications") || "[]"
        )

};


let currentView = "dashboard";


/* =========================================================
   SAMPLE COMMUNITY DATA
   =========================================================

   These are COMMUNITY USERS, not the logged-in user's skills.
   The user's own profile always starts empty.
*/

const community = [

    {
        name: "Aarav Mehta",
        location: "India",
        bio: "Frontend developer focused on clean, accessible web experiences.",
        skills: [
            ["JavaScript", 91],
            ["React", 86],

        ],

        availability: "Available"
    },

    {

        location: "Singapore",
        bio: "Product designer helping people turn ideas into simple interfaces.",
        skills: [
            ["UI/UX Design", 94],
            ["Figma", 88],
            ["Prototyping", 86]
        ],
        learning: ["Python"],
        rating: 4.8,
        exchanges: 19,
        availability: "Available"
    },

    {
        name: "Rohan Verma",
        location: "United Kingdom",
        bio: "Python developer interested in automation and practical AI.",
        skills: [
            ["Python", 92],
            ["Automation", 79],
            ["Data Analysis", 82]
        ],
        learning: ["JavaScript"],
        rating: 4.7,
        exchanges: 16,
        availability: "Busy"
    },

    {
        name: "Ishita Kapoor",
        location: "United Arab Emirates",
        bio: "Communication mentor and content creator helping people present confidently.",
        skills: [
            ["Public Speaking", 89],
            ["Content Writing", 83],
            ["Communication", 92]
        ],
        learning: ["Web Design"],
        rating: 4.9,
        exchanges: 31,
        availability: "Available"
    },

    {
        name: "Kabir Singh",
        location: "Canada",
        bio: "Video editor helping creators tell better stories through visual content.",
        skills: [
            ["Video Editing", 90],
            ["Photography", 81],
            ["Storytelling", 85]
        ],
        learning: ["Marketing"],
        rating: 4.6,
        exchanges: 12,
        availability: "Available"
    },

    {
        name: "Meera Nair",
        location: "Australia",
        bio: "Digital marketer interested in technology, growth and beginner coding.",
        skills: [
            ["Digital Marketing", 87],
            ["SEO", 84],
            ["Content Strategy", 82]
        ],
        learning: ["Python"],
        rating: 4.8,
        exchanges: 21,
        availability: "Available"
    }

];


/* =========================================================
   HELPERS
========================================================= */

const $ = id =>
    document.getElementById(id);


function initials(name) {

    if(!name)
        return "U";

    return name
        .trim()
        .split(/\s+/)
        .map(part => part[0])
        .join("")
        .slice(0,2)
        .toUpperCase();

}


function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function saveState() {

    localStorage.setItem(
        userStorageKey("skills"),
        JSON.stringify(state.skills)
    );

    localStorage.setItem(
        userStorageKey("learning"),
        JSON.stringify(state.learning)
    );

    localStorage.setItem(
        userStorageKey("exchanges"),
        JSON.stringify(state.exchanges)
    );

    localStorage.setItem(
        "sx_theme",
        state.theme
    );

    localStorage.setItem(
        "sx_notifications",
        JSON.stringify(state.notifications)
    );

}


function saveUser() {

    localStorage.setItem(
        "sx_user",
        JSON.stringify(state.user)
    );

}


function refreshUserUI() {

    const name =
        state.user.name || "Welcome";

    const avatar =
        initials(state.user.name);

    $("headerUserName").textContent =
        name;

    $("sideUserName").textContent =
        name;

    $("headerAvatar").textContent =
        avatar;

    $("sideAvatar").textContent =
        avatar;

}


/* =========================================================
   THEME
========================================================= */

function applyTheme() {

    document.body.classList.toggle(
        "dark",
        state.theme === "dark"
    );

    $("themeToggle").textContent =
        state.theme === "dark"
        ? "☀"
        : "☾";

}


/* =========================================================
   PROFILE STATUS
========================================================= */

function profileCompletion() {

    let completed = 0;

    if(state.user.name)
        completed++;

    if(state.user.bio)
        completed++;

    if(state.user.location)
        completed++;

    if(state.skills.length)
        completed++;

    if(state.learning.length)
        completed++;

    return Math.round(
        completed / 5 * 100
    );

}


/* =========================================================
   SKILL MATCHING
========================================================= */

function calculateMatch(person) {

    let score = 55;

    const userSkills =
        state.skills.map(
            s => s.name.toLowerCase()
        );

    const userLearning =
        state.learning.map(
            s => s.toLowerCase()
        );

    person.skills.forEach(skill => {

        if(
            userLearning.includes(
                skill[0].toLowerCase()
            )
        ) {

            score += 15;

        }

    });

    person.learning.forEach(skill => {

        if(
            userSkills.includes(
                skill.toLowerCase()
            )
        ) {

            score += 15;

        }

    });

    return Math.min(
        99,
        score
    );

}


/* =========================================================
   COMMUNITY PERSON CARD
========================================================= */

function personCard(person) {

    const match =
        calculateMatch(person);

    return `

    <article class="card person-card">

        <div class="person-top">

            <div class="person-avatar">
                ${initials(person.name)}
            </div>

            <div class="person-main">

                <span class="person-name">
                    ${escapeHTML(person.name)}
                </span>

                <span class="person-location">
                    ${escapeHTML(person.location)}
                </span>

            </div>

            <span class="match-badge">
                ${match}% match
            </span>

        </div>


        <p class="person-bio">
            ${escapeHTML(person.bio)}
        </p>


        <div class="tags">

            ${person.skills
                .map(
                    skill => `
                    <span class="tag">
                        ${escapeHTML(skill[0])}
                        ·
                        ${skill[1]}%
                    </span>
                    `
                )
                .join("")
            }

        </div>


        <div class="person-bottom">

            <div>

                <span class="rating">
                    ★ ${person.rating}
                </span>

                <span
                    class="muted"
                    style="font-size:9px">

                    · ${person.exchanges}
                    exchanges

                </span>

            </div>


            <span class="available">
                ● ${escapeHTML(person.availability)}
            </span>

        </div>


        <div
            style="
            display:flex;
            gap:7px;
            margin-top:13px
            ">

            <button
                class="btn small secondary"
                onclick='viewPerson(${JSON.stringify(person)})'>

                View Profile

            </button>


            <button
                class="btn small"
                onclick='openChat(${JSON.stringify(person)})'>

                Chat

            </button>

        </div>

    </article>

    `;

}


/* =========================================================
   SKILL CARD
========================================================= */

function skillCard(skill,index) {

    const level =
        Number(skill.level) || 0;

    const label =
        level < 40
        ? "Beginner"
        : level < 70
        ? "Intermediate"
        : "Advanced";

    return `

    <article class="card skill-card">

        <div class="skill-card-top">

            <div class="skill-icon">
                ✦
            </div>


            <div class="skill-info">

                <span class="skill-name">
                    ${escapeHTML(skill.name)}
                </span>

                <span class="skill-level">
                    ${label} · ${level}%

/* =========================================================
   ADD SKILL
========================================================= */

function addSkill() {

    const input =
        $("skillInput");

    if(!input)
        return;

    const value =
        input.value.trim();

    if(!value)
        return;

    const exists =
        state.skills.some(
            skill =>
                skill.name.toLowerCase() ===
                value.toLowerCase()
        );

    if(exists) {

        showToast(
            "This skill is already in your list."
        );

        return;

    }

    state.skills.push({

        name: value,

        level: 50

    });

    saveState();

    render();

    showToast(
        `"${value}" added to your skills.`
    );

}


/* =========================================================
   UPDATE SKILL LEVEL
========================================================= */

function updateSkillLevel(
    index,
    value
) {

    if(!state.skills[index])
        return;

    state.skills[index].level =
        Number(value);

    saveState();

    render();

}


/* =========================================================
   DELETE SKILL
========================================================= */

function deleteSkill(index) {

    const skill =
        state.skills[index];

    if(!skill)
        return;

    state.skills.splice(
        index,
        1
    );

    saveState();

    render();

}


/* =========================================================
   ADD LEARNING
========================================================= */

function addLearning() {

    const input =
        $("learningInput");

    if(!input)
        return;

    const value =
        input.value.trim();

    if(!value)
        return;

    const exists =
        state.learning.some(
            skill =>
                skill.toLowerCase() ===
                value.toLowerCase()
        );

    if(exists) {

        showToast(
            "This learning goal is already added."
        );

        return;

    }

    state.learning.push(
        value
    );

    saveState();

    render();

    showToast(
        `"${value}" added to your learning goals.`
    );

}


/* =========================================================
   DELETE LEARNING
========================================================= */

function deleteLearning(index) {

    state.learning.splice(

    );

    saveState();

    render();

}


/* =========================================================
   DISCOVER
========================================================= */

function discover() {

    const skills = {};

    community.forEach(person => {

        person.skills.forEach(
            skill => {

                if(!skills[skill[0]])
                    skills[skill[0]] = [];

                skills[skill[0]].push(
                    skill[1]
                );

            }
        );

    });


    const list =
        Object.entries(skills)
        .map(
            ([name,levels]) => ({

                name,

                people:
                    levels.length,

                average:
                    Math.round(
                        levels.reduce(
                            (a,b)=>a+b,
                            0
                        ) /
                        levels.length
                    )

            })
        )
        .sort(
            (a,b) =>
                b.people-a.people
        );


    return `

    <div class="section-heading">

        <div>

            <h2>
                Discover Skills
            </h2>

                Explore skills shared by the SkillXChange community.
            </p>

    <div class="grid-3">

        ${
            list
            .map(skill =>

                `

                <article class="card">

                    <div class="skill-card-top">

                        <div class="skill-icon">
                            ◈
                        </div>

                        <div class="skill-info">

                            <span class="skill-name">
                                ${escapeHTML(skill.name)}
                            </span>

                            <span class="skill-level">
                                ${skill.people}

                            </span>

                        </div>

                    </div>


                    <div
                        style="
                        display:flex;
                        justify-content:space-between;
                        margin-top:16px;
                        color:var(--muted);
                        font-size:9px">

                        <span>
                            Average proficiency

                        <strong>
                            ${skill.average}%
                        </strong>

                    </div>


                    <div class="progress">

                        <div
                            class="progress-bar"
                            style="width:${skill.average}%">
                        </div>

                    </div>


                    <button
                        class="btn small secondary"

                        onclick="searchSkill('${escapeHTML(skill.name)}')">

                        Find People

                    </button>

                </article>

                `

            )
            .join("")

    </div>

    `;

}

/* =========================================================
   SEND EXCHANGE
========================================================= */

function sendExchange(person) {

    const offer =
        $("offerSkill").value.trim();

    const want =
        $("wantSkill").value.trim();

    if(!offer || !want) {

        showToast(
            "Please add both skills before sending."
        );

        return;

    }


    const exchange = {

        name:
            person.name,

        offer,

        want,

        status:
            "Pending",

        date:
            new Date().toLocaleDateString()

    };


    state.exchanges.unshift(
        exchange
    );


    state.notifications.unshift({

        title:
            "Exchange request created",

        text:
            `Your request to ${person.name} is pending.`,

        time:
            "Just now"

    });


    saveState();

    closeModal();

    showView("exchanges");

}

   SEARCH
========================================================= */

function searchSkill(value) {

    $("globalSearch").value =
        value;

    performSearch(value);

    $("searchResults")
        .classList
        .remove("show");

}


function performSearch(query) {

    const q =
        query
        .trim()
        .toLowerCase();


    if(!q) {

        showView("discover");

        return;

    }


    const people =
        community.filter(
            person => {

                const text = [

                    person.name,
                    person.location,
                    person.bio,

                    ...person.skills.flat(),

                    ...person.learning

                ]
                .join(" ")
                .toLowerCase();


                return text.includes(q);

            }
        );


    const skills =
        community
        .flatMap(
            person =>
                person.skills.map(
                    skill =>
                        skill[0]
                )
        )
        .filter(
            (skill,index,array) =>
                skill.toLowerCase().includes(q) &&
                array.indexOf(skill) === index
        );


    $("main").innerHTML = `

    <div class="section-heading">

        <div>

            <h2>
                Search results
            </h2>

            <p>
                Results for “${escapeHTML(query)}”
            </p>

        </div>

        <button
            onclick="showView('dashboard')">

            ← Dashboard

        </button>

    </div>


    ${
        skills.length

        ?

        `

        <section class="section">

            <div class="card">

                <div class="card-header">

                    <div>

                        <h3 class="card-title">
                            Skills
                        </h3>

                    </div>

                </div>

                <div class="tags">

                    ${
                        skills
                        .map(
                            skill =>

                            `

                            <button
                                class="tag"
                                onclick="searchSkill('${escapeHTML(skill)}')">

                                ${escapeHTML(skill)}

                            </button>

                            `
                        )
                        .join("")
                    }

                </div>

            </div>

        </section>

        `

        :

        ""
    }


    <section class="section">

        <div class="section-heading">

            <div>

                <h2>
                    People
                </h2>

            </div>

        </div>


        ${
            people.length

            ?

            `<div class="grid-3">

                ${
                    people
                    .map(
                        person =>
                            personCard(person)
                    )
                    .join("")
                }

            </div>`

            :

            `

            <div class="empty-state">

                <div class="empty-icon">
                    ⌕
                </div>

                <h3>
                    No people found
                </h3>

                <p>
                    Try another skill or keyword.
                </p>

                <button
                    class="btn"
                    onclick="showView('discover')">

                    Explore Skills

                </button>

            </div>

            `
        }

    </section>

    `;

}


/* SEARCH AUTOCOMPLETE */

$("globalSearch")
    .addEventListener(
        "input",
        event => {

            const q =
                event.target.value
                .trim()
                .toLowerCase();


            if(q.length < 2) {

                $("searchResults")
                    .classList
                    .remove("show");

                return;

            }


            const suggestions = [];


            community.forEach(
                person => {

                    person.skills.forEach(
                        skill => {

                            if(
                                skill[0]
                                .toLowerCase()
                                .includes(q) &&

                                !suggestions
                                .includes(
                                    skill[0]
                                )
                            ) {

                                suggestions.push(
                                    skill[0]
                                );

                            }

                        }
                    );

                }
            );


            if(!suggestions.length) {

                $("searchResults")
                    .classList
                    .remove("show");

                return;

            }


            $("searchResults").innerHTML =
                suggestions
                .slice(0,6)
                .map(
                    skill =>

                    `

                    <button
                        onclick="searchSkill('${escapeHTML(skill)}')">

                        ◈
                        ${escapeHTML(skill)}

                    </button>

                    `
                )
                .join("");


            $("searchResults")
                .classList
                .add("show");

        }
    );


$("globalSearch")
    .addEventListener(
        "keydown",
        event => {

            if(
                event.key === "Enter"
            ) {

                performSearch(
                    event.target.value
                );

                $("searchResults")
                    .classList
                    .remove("show");

            }

        }
    );


/* =========================================================
   VIEW SYSTEM
========================================================= */

function showView(view) {

    currentView =
        view;

    $("profileDropdown")
        .classList
        .remove("show");

    $("sidebar")
        .classList
        .remove("open");


    document
        .querySelectorAll(
            ".nav-item"
        )
        .forEach(
            item => {

                item.classList.toggle(
                    "active",
                    item.dataset.view === view
                );

            }
        );


    render();

}


function render() {

    let html;


    switch(currentView) {

        case "dashboard":
            html = dashboard();
            break;

        case "skills":
            html = skillsView();
            break;

        case "discover":
            html = discover();
            break;

        case "people":
            html = peopleView();
            break;

        case "recommendations":
            html = recommendationsView();
            break;

        case "exchanges":
            html = exchangesView();
            break;

        case "messages":
            html = messagesView();
            break;

        case "notifications":
            html = notificationsView();
            break;

        case "profile":
            html = profileView();
            break;

        case "settings":
            html = settingsView();
            break;

        default:
            html = dashboard();

    }


    $("main").innerHTML =
        html;

}


/* =========================================================
   TOAST
========================================================= */

function showToast(message) {

    const old =
        document.querySelector(
            ".sx-toast"
        );

    if(old)
        old.remove();


    const toast =
        document.createElement(
            "div"
        );


    toast.className =
        "sx-toast";


    toast.textContent =
        message;


    Object.assign(
        toast.style,
        {

            position:"fixed",
            left:"50%",
            bottom:"25px",
            transform:"translateX(-50%)",
            zIndex:"500",
            padding:"12px 17px",
            borderRadius:"12px",
            background:"var(--text)",
            color:"var(--surface)",
            fontSize:"11px",
            fontWeight:"700",
            boxShadow:"var(--shadow)"

        }
    );


    document.body.appendChild(
        toast
    );


    setTimeout(
        () => toast.remove(),
        2500
    );

}


/* =========================================================
   AI
========================================================= */

function addAIMessage(
    message,
    type = "ai"
) {

    $("aiMessages")
        .insertAdjacentHTML(
            "beforeend",

            `

            <div class="bubble ${type}">

                ${message}

                <span class="bubble-time">
                    ${new Date()
                        .toLocaleTimeString(
                            [],
                            {
                                hour:"2-digit",
                                minute:"2-digit"
                            }
                        )}
                </span>

            </div>

            `
        );


    $("aiMessages").scrollTop =
        $("aiMessages").scrollHeight;

}


function getAIResponse(question) {

    const q =
        question.toLowerCase();


    if(
        q.includes("skill") &&
        (
            q.includes("find") ||
            q.includes("search")
        )
    ) {

        return `

        I can help you find the right skill.

        ${
            state.learning.length

            ?

            `You currently want to learn:
            <b>${state.learning.map(
                escapeHTML
            ).join(", ")}</b>.`

            :

            `You haven't added any learning goals yet.
            Add one from <b>My Skills</b> and I'll
            make your recommendations more relevant.`
        }

        `;

    }


    if(
        q.includes("match") ||
        q.includes("recommend")
    ) {

        return `

        Your matches are calculated from
        two things:

        <br><br>

        • What you can teach
        <br>
        • What you want to learn

        <br>

        ${
            state.skills.length ||
            state.learning.length

            ?

            `You already have ${
                state.skills.length +
                state.learning.length
            } profile interests. Check
            <b>Recommendations</b> to explore people.`

            :

            `Start by adding a skill or learning goal.
            That gives SkillXChange something to match.`
        }

        `;

    }


    if(
        q.includes("learn") ||
        q.includes("should i")
    ) {

        if(state.learning.length) {

            return `

            Your current learning goals are:

            <br><br>

            <b>
                ${state.learning
                    .map(escapeHTML)
                    .join(", ")}
            </b>

            <br><br>

            I recommend finding people who are
            strong in these areas and starting
            a two-way exchange.

            `;

        }


        return `

        You haven't added a learning goal yet.

        <br><br>

        Go to <b>My Skills</b> and add the
        first thing you want to learn.

        `;

    }


    if(
        q.includes("work") ||
        q.includes("how")
    ) {

        return `

        SkillXChange is built around
        <b>two-way learning</b>.

        <br><br>

        1. Add what you can teach.
        <br>
        2. Add what you want to learn.
        <br>
        3. Discover compatible people.
        <br>
        4. Start a conversation.
        <br>
        5. Create a skill exchange.

        `;

    }


    if(
        q.includes("profile")
    ) {

        return `

        Your profile is ${
            profileCompletion()
        }% complete.

        <br><br>

        Add your bio, location,
        skills and learning goals
        to make it more useful.

        `;

    }


    return `

    I can help you with:

    <br><br>

    • Finding skills
    <br>
    • Skill recommendations
    <br>
    • Learning goals
    <br>
    • Skill exchanges
    <br>
    • Your profile
    <br>
    • How SkillXChange works

    <br><br>

    What would you like to explore?

    `;

}


function sendAI() {

    const input =
        $("aiInput");

    const value =
        input.value.trim();


    if(!value)
        return;


    addAIMessage(
        escapeHTML(value),
        "user"
    );


    input.value = "";


    setTimeout(
        () => {

            addAIMessage(
                getAIResponse(value)
            );

        },
        350
    );

}

                        state.user.name
                        ? `Hi ${escapeHTML(state.user.name)}!`
                        : `Hi there!`
                    }

                    👋

                    <br><br>

                    I'm your SkillXChange AI.
                    I can help you discover skills,
                    understand your matches and
                    plan your next learning step.

                `);

            }

        }
    );


$("aiClose")
    .addEventListener(
        "click",
        () => {

            $("aiPanel")
                .classList
                .remove("open");

        }
    );


$("aiSend")
    .addEventListener(
        "click",
        sendAI
    );


$("aiInput")
    .addEventListener(
        "keydown",
        event => {

            if(
                event.key === "Enter"
            ) {

                sendAI();

            }

        }
    );


document
    .querySelectorAll(
        "[data-ai]"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    $("aiInput").value =
                        button.dataset.ai;

                    sendAI();

                }
            );

        }
    );


/* =========================================================
   HEADER EVENTS
========================================================= */

$("themeToggle")
    .addEventListener(
        "click",
        () => {

            state.theme =
                state.theme === "dark"
                ? "light"
                : "dark";

            applyTheme();

            saveState();

        }
    );


$("userButton")
    .addEventListener(
        "click",
        () => {

            $("profileDropdown")
                .classList
                .toggle("show");

        }
    );


$("mobileMenu")
    .addEventListener(
        "click",
        () => {

            $("sidebar")
                .classList
                .toggle("open");

        }
    );


document.addEventListener(
    "click",
    event => {

        if(
            !event.target.closest(
                ".header-actions"
            )
        ) {

            $("profileDropdown")
                .classList
                .remove("show");

        }

    }
);


/* =========================================================
   NAVIGATION EVENTS
========================================================= */

document
    .querySelectorAll(
        "[data-view]"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    showView(
                        button.dataset.view
                    );

                }
            );

        }
    );


/* =========================================================
   NOTIFICATION BUTTON
========================================================= */

$("notificationButton")
    .addEventListener(
        "click",
        () => {

            showView(
                "notifications"
            );

        }
    );


/* =========================================================
   LOGOUT
========================================================= */

$("logoutButton")
    .addEventListener(
        "click",
        () => {

            /*
               We intentionally do NOT destroy the
               user's skills/profile here.

               If your login page has its own logout
               logic, redirect to that page.

               Change the path below if your login file
               has a different name.
            */

            window.location.href =
                "index.html";

        }
    );


/* =========================================================
   CLOSE SEARCH ON OUTSIDE CLICK
========================================================= */

document.addEventListener(
    "click",
    event => {

        if(
            !event.target.closest(
                ".search"
            )
        ) {

            $("searchResults")
                .classList
                .remove("show");

        }

    }
);


/* =========================================================
   INITIALISE
========================================================= */

refreshUserUI();

applyTheme();

render();

const user = JSON.parse(localStorage.getItem("sx_user"));

if (user && user.name) {
    document.querySelectorAll(".user-name").forEach(element => {
        element.textContent = user.name;
    });
}
</script>

</body>
</html>
