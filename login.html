<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillXChange — Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#111111;
  --text:#f7f5f2;
  --muted:#aaa6a2;
  --line:rgba(255,255,255,.13);
  --glass:rgba(15,15,15,.42);
}

html,body{min-height:100%;}

body{
  min-height:100vh;
  font-family:Inter,Arial,sans-serif;
  color:var(--text);
  background:#111;
  overflow-x:hidden;
}

/* Soft cinematic background like the reference image */
.background{
  position:fixed;
  inset:0;
  z-index:-2;
  overflow:hidden;
  background:
    radial-gradient(circle at 10% 78%, rgba(185,139,82,.75) 0, rgba(185,139,82,.38) 15%, transparent 40%),
    radial-gradient(circle at 75% 18%, rgba(102,48,150,.68) 0, rgba(83,52,126,.32) 18%, transparent 42%),
    radial-gradient(circle at 93% 73%, rgba(134,39,66,.66) 0, rgba(108,42,65,.32) 20%, transparent 43%),
    radial-gradient(circle at 55% 55%, rgba(32,42,58,.30), transparent 35%),
    #111;
  filter:saturate(105%);
}

.background:after{
  content:"";
  position:absolute;
  inset:-10%;
  background:
    radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.36) 100%);
  pointer-events:none;
}

.glow{
  position:absolute;
  border-radius:50%;
  filter:blur(90px);
  opacity:.22;
  pointer-events:none;
}
.glow.one{width:500px;height:500px;left:-260px;top:260px;background:#c79a63}
.glow.two{width:470px;height:470px;right:-180px;top:-100px;background:#7136a4}
.glow.three{width:520px;height:520px;right:-150px;bottom:-250px;background:#a12e4d}

/* Top brand */
.top-brand{
  position:relative;
  z-index:2;
  width:min(920px,94vw);
  min-height:135px;
  margin:0 auto;
  padding:20px 0 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:22px;
}

.brand-logo{
  width:108px;
  height:108px;
  object-fit:contain;
  display:block;
  border-radius:50%;
  filter:drop-shadow(0 10px 30px rgba(0,0,0,.45));
}

.brand-copy{
  text-align:left;
  line-height:1;
}

.brand-name{
  font-size:clamp(42px,5.2vw,72px);
  font-weight:700;
  letter-spacing:-3px;
  color:#f8f7f5;
  text-shadow:0 4px 28px rgba(0,0,0,.3);
}

.brand-name span{
  color:#f3bd45;
}

.brand-tagline{
  margin-top:14px;
  padding-top:12px;
  border-top:1px solid rgba(240,187,66,.55);
  color:#f1bd48;
  font-size:clamp(14px,1.55vw,22px);
  font-weight:700;
  letter-spacing:7px;
  white-space:nowrap;
  text-shadow:0 0 16px rgba(241,189,72,.22);
}

.brand-tagline:after{
  content:"";
  display:block;
  width:46%;
  height:2px;
  margin:10px auto 0;
  background:linear-gradient(90deg,transparent,#f3bd45,transparent);
  box-shadow:0 0 12px rgba(243,189,69,.8);
}

/* Main content */
.page{
  min-height:calc(100vh - 72px);
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:72px 20px 60px;
}

.auth{
  width:100%;
  max-width:560px;
  text-align:center;
}

.heading h1{
  font-family:"DM Serif Display",Georgia,serif;
  font-size:clamp(52px,6vw,78px);
  font-weight:400;
  line-height:1;
  letter-spacing:-2.5px;
  margin-bottom:22px;
  text-shadow:0 4px 25px rgba(0,0,0,.3);
}

.heading p{
  color:#b8b4b0;
  font-size:16px;
  margin-bottom:22px;
}

/* Social buttons */
.social-row{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-bottom:28px;
}

.social-btn{
  height:52px;
  min-width:135px;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:28px;
  color:white;
  background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(0,0,0,.30));
  box-shadow:inset 0 1px 1px rgba(255,255,255,.08),0 7px 22px rgba(0,0,0,.25);
  cursor:pointer;
  font:600 14px Inter,sans-serif;
  transition:.25s ease;
}

.social-btn:hover{
  transform:translateY(-2px);
  border-color:rgba(255,255,255,.30);
  background:rgba(255,255,255,.10);
}

.google-icon{
  width:20px;
  height:20px;
}

/* Divider */
.divider{
  display:flex;
  align-items:center;
  gap:12px;
  color:#aaa6a2;
  font-size:12px;
  margin:0 auto 26px;
  max-width:370px;
}

.divider:before,.divider:after{
  content:"";
  flex:1;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--line));
}
.divider:after{
  background:linear-gradient(90deg,var(--line),transparent);
}

/* Form */
form{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:13px;
}

.input-wrap{
  position:relative;
}

.input-wrap input{
  width:100%;
  height:60px;
  padding:0 48px 0 52px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:30px;
  outline:none;
  background:linear-gradient(100deg,rgba(255,255,255,.075),rgba(0,0,0,.24));
  color:white;
  font:400 15px Inter,sans-serif;
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.06),
    0 7px 25px rgba(0,0,0,.20);
  transition:.25s ease;
}

.input-wrap input::placeholder{color:#a9a4a0}

.input-wrap input:focus{
  border-color:rgba(255,255,255,.42);
  background:rgba(255,255,255,.09);
  box-shadow:0 0 0 3px rgba(255,255,255,.06),0 8px 25px rgba(0,0,0,.22);
}

.input-icon{
  position:absolute;
  left:22px;
  top:50%;
  transform:translateY(-50%);
  color:#d2cfcb;
  font-size:18px;
  pointer-events:none;
}

.eye{
  position:absolute;
  right:18px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:transparent;
  color:#aaa6a2;
  cursor:pointer;
  font-size:17px;
  padding:6px;
}

.eye:hover{color:white}

.form-options{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:2px 8px 3px;
  font-size:12px;
  color:#aaa6a2;
}

.remember{
  display:flex;
  align-items:center;
  gap:7px;
}

.remember input{accent-color:#8a61ff}

.form-options a{
  color:#d0c4ff;
  text-decoration:none;
}
.form-options a:hover{text-decoration:underline}

/* Main action */
.primary{
  height:58px;
  border:0;
  border-radius:30px;
  color:white;
  background:linear-gradient(100deg,#ffb52e 0%,#e07b45 38%,#8d2fe5 72%,#5c1fe8 100%);
  box-shadow:0 12px 35px rgba(130,65,235,.38),0 0 18px rgba(255,183,48,.22);
  cursor:pointer;
  font:700 15px Inter,sans-serif;
  transition:.25s ease;
}

.primary:hover{
  transform:translateY(-2px);
  box-shadow:0 18px 42px rgba(130,65,235,.48),0 0 24px rgba(255,183,48,.26);
}

.primary:disabled{opacity:.65;cursor:wait;transform:none}

.switch{
  margin-top:24px;
  color:#aaa6a2;
  font-size:13px;
}

.switch button{
  border:0;
  background:none;
  color:#d2c7ff;
  cursor:pointer;
  font:600 13px Inter,sans-serif;
}
.switch button:hover{text-decoration:underline}

.hidden{display:none!important}

#toast{
  position:fixed;
  left:50%;
  bottom:28px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  padding:13px 20px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:14px;
  background:rgba(20,20,20,.88);
  backdrop-filter:blur(15px);
  color:white;
  font-size:13px;
  transition:.3s ease;
  z-index:20;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

.button-arrow{
  display:inline-block;
  margin-left:12px;
  font-size:24px;
  line-height:0;
  vertical-align:-2px;
}

@media(max-width:700px){
  .top-brand{
    gap:12px;
    min-height:110px;
    padding-top:12px;
  }

  .brand-logo{
    width:76px;
    height:76px;
  }

  .brand-name{
    font-size:38px;
    letter-spacing:-2px;
  }

  .brand-tagline{
    font-size:11px;
    letter-spacing:4px;
    margin-top:10px;
    padding-top:9px;
  }
}

@media(max-width:600px){
  .top-brand{height:64px}
  .page{
    min-height:calc(100vh - 64px);
    padding:55px 18px 45px;
  }
  .heading h1{
    font-size:48px;
    letter-spacing:-2px;
  }
  .heading p{font-size:14px}
  .social-row{gap:10px}
  .social-btn{min-width:125px;padding:0 14px}
  .input-wrap input{height:56px}
}
</style>

<body>
<div class="background">
  <div class="glow one"></div>
  <div class="glow two"></div>
  <div class="glow three"></div>
</div>

<header class="top-brand">
  <img class="brand-logo" src="skillxchange-logo.png" alt="SkillXChange Logo">
  <div class="brand-copy">
    <div class="brand-name">Skill<span>X</span>Change</div>
    <div class="brand-tagline">LEARN . SHARE . GROW</div>
  </div>
</header>

<main class="page">
  <section class="auth">

    <!-- LOGIN -->
    <div id="loginForm">
      <div class="heading">
        <h1>Get started with Us</h1>
        <p>Continue with</p>
      </div>

      <div class="social-row">
        <button class="social-btn" type="button" onclick="googleLogin()">
          <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M21.35 12.27c0-.72-.06-1.41-.18-2.07H12v3.92h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.24z"></path>
            <path fill="#34A853" d="M12 21.75c2.63 0 4.84-.87 6.45-2.34l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.52A9.75 9.75 0 0 0 12 21.75z"></path>
            <path fill="#FBBC05" d="M6.54 13.85a5.86 5.86 0 0 1 0-3.7V7.63H3.3a9.75 9.75 0 0 0 0 8.74l3.24-2.52z"></path>
            <path fill="#EA4335" d="M12 6.12c1.43 0 2.72.49 3.73 1.45l2.8-2.8C16.84 3.18 14.63 2.25 12 2.25A9.75 9.75 0 0 0 3.3 7.63l3.24 2.52C7.31 7.84 9.46 6.12 12 6.12z"></path>
          </svg>
          Google
        </button>
      </div>

      <div class="divider"><span>OR</span></div>

      <form onsubmit="login(event)">
        <div class="input-wrap">
          <span class="input-icon">✉</span>
          <input id="loginEmail" type="email" placeholder="Email Address" autocomplete="email" required="">
        </div>

        <div class="input-wrap">
          <span class="input-icon">●</span>
          <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" required="">
          <button class="eye" type="button" onclick="togglePassword('loginPassword',this)" aria-label="Show password">◉</button>
        </div>

        <div class="form-options">
          <label class="remember">
            <input id="rememberMe" type="checkbox">
            <span>Remember me</span>
          </label>
          <a href="#" onclick="forgotPassword(event)">Forgot password?</a>
        </div>

        <button class="primary" id="loginButton" type="submit">Sign In <span class="button-arrow">→</span></button>
      </form>

      <p class="switch">
        Don't have an account?
        <button type="button" onclick="showSignup()">Create account</button>
      </p>
    </div>

    <!-- SIGN UP -->
    <div id="signupForm" class="hidden">
      <div class="heading">
        <h1>Create account</h1>
        <p>Join SkillXChange and start learning.</p>
      </div>

      <div class="social-row">
        <button class="social-btn" type="button" onclick="googleLogin()">Google</button>
      </div>

      <div class="divider"><span>OR</span></div>

      <form onsubmit="signup(event)">
        <div class="input-wrap">
          <span class="input-icon">●</span>
          <input id="signupName" type="text" placeholder="Full name" autocomplete="name" required="">
        </div>

        <div class="input-wrap">
          <span class="input-icon">✉</span>
          <input id="signupEmail" type="email" placeholder="Email Address" autocomplete="email" required="">
        </div>

        <div class="input-wrap">
          <span class="input-icon">●</span>
          <input id="signupPassword" type="password" placeholder="Password" minlength="8" autocomplete="new-password" required="">
          <button class="eye" type="button" onclick="togglePassword('signupPassword',this)">◉</button>
        </div>

        <div class="input-wrap">
          <span class="input-icon">●</span>
          <input id="confirmPassword" type="password" placeholder="Confirm password" autocomplete="new-password" required="">
        </div>

        <div class="form-options" style="justify-content:flex-start">
          <label class="remember">
            <input id="terms" type="checkbox" required="">
            <span>I agree to the Terms &amp; Privacy Policy</span>
          </label>
        </div>

        <button class="primary" type="submit">Create Account</button>
      </form>

      <p class="switch">
        Already have an account?
        <button type="button" onclick="showLogin()">Sign in</button>
      </p>
    </div>

  </section>
</main>

<div id="toast"></div>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  updateProfile,
  sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCCxKuvUEKoJpjn8P-o7eC8J1b9d-9r_2Q",
  authDomain: "skillxchange-a178b.firebaseapp.com",
  projectId: "skillxchange-a178b",
  storageBucket: "skillxchange-a178b.firebasestorage.app",
  messagingSenderId: "542243771576",
  appId: "1:542243771576:web:e6e6f8997a8e525cb5504d",
  measurementId: "G-25NC671DZY"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

function showToast(message){
  const toast=document.getElementById("toast");
  toast.textContent=message;
  toast.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>toast.classList.remove("show"),3200);
}

function saveUser(user){
  localStorage.setItem("skillUser",JSON.stringify({
    name:user.displayName || "SkillX User",
    email:user.email || "",
    photo:user.photoURL || ""
  }));
}

function goDashboard(){
  window.location.href="dashboard.html";
}

window.showSignup=()=>{
  document.getElementById("loginForm").classList.add("hidden");
  document.getElementById("signupForm").classList.remove("hidden");
};

window.showLogin=()=>{
  document.getElementById("signupForm").classList.add("hidden");
  document.getElementById("loginForm").classList.remove("hidden");
};

window.togglePassword=(id,button)=>{
  const input=document.getElementById(id);
  input.type=input.type==="password" ? "text" : "password";
  button.textContent=input.type==="password" ? "◉" : "◎";
};

window.login=async(event)=>{
  event.preventDefault();

  const email=document.getElementById("loginEmail").value.trim();
  const password=document.getElementById("loginPassword").value;
  const button=document.getElementById("loginButton");

  if(!email || !password){
    showToast("Please enter your email and password.");
    return;
  }

  button.disabled=true;
  button.textContent="Signing in...";

  try{
    const credential=await signInWithEmailAndPassword(auth,email,password);
    saveUser(credential.user);
    showToast("Login successful!");
    setTimeout(goDashboard,800);
  }catch(error){
    let message="Login failed.";
    if(error.code==="auth/invalid-credential") message="Incorrect email or password.";
    else if(error.code==="auth/user-not-found") message="No account found with this email.";
    else if(error.code==="auth/wrong-password") message="Incorrect password.";
    else if(error.code==="auth/invalid-email") message="Please enter a valid email.";
    else if(error.code==="auth/too-many-requests") message="Too many attempts. Please try again later.";
    else message=error.message;
    showToast(message);
  }finally{
    button.disabled=false;
    button.textContent="Sign In";
  }
};

window.signup=async(event)=>{
  event.preventDefault();

  const name=document.getElementById("signupName").value.trim();
  const email=document.getElementById("signupEmail").value.trim();
  const password=document.getElementById("signupPassword").value;
  const confirm=document.getElementById("confirmPassword").value;

  if(password!==confirm){
    showToast("Passwords do not match.");
    return;
  }

  try{
    const credential=await createUserWithEmailAndPassword(auth,email,password);
    await updateProfile(credential.user,{displayName:name});
    saveUser({...credential.user,displayName:name});
    showToast("Account created successfully!");
    setTimeout(goDashboard,800);
  }catch(error){
    let message="Could not create account.";
    if(error.code==="auth/email-already-in-use") message="This email is already registered.";
    else if(error.code==="auth/weak-password") message="Use a stronger password.";
    else if(error.code==="auth/invalid-email") message="Please enter a valid email.";
    else message=error.message;
    showToast(message);
  }
};

window.googleLogin=async()=>{
  try{
    const result=await signInWithPopup(auth,provider);
    saveUser(result.user);
    showToast("Welcome to SkillXChange!");
    setTimeout(goDashboard,800);
  }catch(error){
    if(error.code==="auth/popup-closed-by-user") return;
    if(error.code==="auth/unauthorized-domain"){
      showToast("This domain is not authorized in Firebase.");
    }else{
      console.error(error);
      showToast("Google login failed.");
    }
  }
};

window.forgotPassword=async(event)=>{
  event.preventDefault();
  const email=document.getElementById("loginEmail").value.trim();

  if(!email){
    showToast("Enter your email first.");
    document.getElementById("loginEmail").focus();
    return;
  }

  try{
    await sendPasswordResetEmail(auth,email);
    showToast("Password reset email sent.");
  }catch(error){
    if(error.code==="auth/user-not-found"){
      showToast("No account found with this email.");
    }else{
      showToast("Could not send reset email.");
    }
  }
};
</script>
